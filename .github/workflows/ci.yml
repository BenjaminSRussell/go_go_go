name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: mkdir -p bin && go build -tags sqlite_fts5 -o bin/gogogoscraper ./cmd/gogogoscraper
      - name: Test
        run: go test ./...
      - name: Test storage with FTS5
        run: go test -tags sqlite_fts5 ./internal/storage/

  race:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race
        run: go test -race ./internal/...
